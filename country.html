<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Dependencies — Pays</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap');

:root {
  --bg:#ffffff; --bg2:#f7f7f5; --bg3:#efefed;
  --border:#e4e4e0; --border2:#d0d0ca;
  --text:#1a1a18; --text2:#6b6b65; --text3:#a8a8a0;
  --accent:#1a56db; --red:#d63b2f; --red-l:#fcecea;
  --blue:#1a56db; --blue-l:#eaf0fd;
  --green:#1a8a4a; --green-l:#eaf5ee;
  --mono:'DM Mono',monospace; --sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:14px;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}

/* Header */
.header{display:flex;align-items:center;gap:1rem;padding:.65rem 1.5rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:50;}
.back{font-family:var(--mono);font-size:.7rem;color:var(--text3);text-decoration:none;padding:.3rem .6rem;border:1px solid var(--border2);border-radius:3px;letter-spacing:.03em;}
.back:hover{color:var(--accent);border-color:var(--accent);}
.h-name{font-weight:500;font-size:1.05rem;}
.h-iso{font-family:var(--mono);font-size:.72rem;color:var(--text3);margin-left:.4rem;}
.h-gdp{font-family:var(--mono);font-size:.7rem;color:var(--text2);margin-left:auto;border:1px solid var(--border);padding:.25rem .6rem;border-radius:3px;}

/* Controls */
.controls{display:flex;align-items:center;gap:.5rem;padding:.45rem 1.5rem;border-bottom:1px solid var(--border);background:var(--bg2);flex-wrap:wrap;}
.ctrl-label{font-family:var(--mono);font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.ctrl-group{display:flex;gap:1px;}
.ctrl-btn{font-family:var(--mono);font-size:.7rem;padding:.28rem .65rem;border:1px solid var(--border2);background:var(--bg);color:var(--text2);cursor:pointer;transition:all .12s;}
.ctrl-btn:first-child{border-radius:3px 0 0 3px;}
.ctrl-btn:last-child{border-radius:0 3px 3px 0;}
.ctrl-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);}
.ctrl-sep{width:1px;background:var(--border2);margin:0 .4rem;align-self:stretch;}

/* KPI */
.kpi-bar{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
.kpi{padding:.55rem 1.25rem;border-right:1px solid var(--border);flex-shrink:0;}
.kpi-l{font-family:var(--mono);font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.kpi-v{font-family:var(--mono);font-size:.95rem;font-weight:500;color:var(--text);}
.kpi-v.blue{color:var(--blue);}
.kpi-v.red{color:var(--red);}
.kpi-v.green{color:var(--green);}

/* Main layout: map left, charts right */
.main{display:grid;grid-template-columns:1fr 340px;border-bottom:1px solid var(--border);}
@media(max-width:900px){.main{grid-template-columns:1fr;}}

/* Map */
#map-wrap{position:relative;background:#f0f2f0;border-right:1px solid var(--border);}
#tooltip{display:none;position:absolute;background:var(--bg);border:1px solid var(--border2);border-radius:4px;padding:.65rem .9rem;font-size:.75rem;max-width:220px;pointer-events:none;z-index:100;box-shadow:0 4px 14px rgba(0,0,0,.07);}
.tt-name{font-weight:500;margin-bottom:.35rem;}
.tt-row{display:flex;justify-content:space-between;gap:.75rem;color:var(--text2);margin-bottom:2px;}
.tt-v{font-family:var(--mono);font-size:.7rem;color:var(--text);}

/* Side panel */
.side{overflow-y:auto;max-height:calc(100vh - 160px);}
.side-section{border-bottom:1px solid var(--border);padding:.9rem 1.1rem;}
.side-title{font-family:var(--mono);font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:.7rem;}

/* Funnel / bar charts */
.bar-row{display:flex;align-items:center;gap:.5rem;margin-bottom:5px;}
.bar-label{font-size:.72rem;color:var(--text2);width:120px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;background:var(--bg3);border-radius:2px;height:16px;overflow:hidden;}
.bar-fill{height:100%;border-radius:2px;transition:width .5s cubic-bezier(.16,1,.3,1);}
.bar-num{font-family:var(--mono);font-size:.68rem;color:var(--text3);width:40px;text-align:right;flex-shrink:0;}

/* Funnel highlight */
.funnel-ec   .bar-fill{background:#1a1a18;}
.funnel-abs  .bar-fill{background:#6b6b65;}
.funnel-stick .bar-fill{background:#a8a8a0;}

/* Sector */
.sector-fill{background:var(--accent);opacity:.6;}

/* Partners */
.partner-import .bar-fill{background:var(--red);}
.partner-export .bar-fill{background:var(--green);}

/* Bottom section: products */
.products-section{padding:1rem 1.5rem 2rem;}
.prod-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem;}
.prod-title{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);}
.prod-count{font-family:var(--mono);font-size:.65rem;color:var(--text3);}
table{width:100%;border-collapse:collapse;font-size:.75rem;}
th{text-align:left;padding:.3rem .6rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);border-bottom:1px solid var(--border);font-weight:400;}
td{padding:.35rem .6rem;border-bottom:1px solid var(--bg3);color:var(--text2);}
td:first-child{font-family:var(--mono);font-size:.68rem;color:var(--accent);}
td.desc{color:var(--text);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
td.num{font-family:var(--mono);text-align:right;color:var(--text);}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bg3);}
.dot.on{background:var(--accent);}

footer{padding:.6rem 1.5rem;border-top:1px solid var(--border);font-family:var(--mono);font-size:.62rem;color:var(--text3);display:flex;justify-content:space-between;}
footer a{color:var(--text3);text-decoration:underline;}
</style>
</head>
<body>

<header class="header">
  <a href="index.html" class="back">← Atlas</a>
  <span class="h-name" id="h-name">—</span><span class="h-iso" id="h-iso">—</span>
  <span class="h-gdp">PIB moy. 2015–19 : <span id="h-gdp">—</span> Md€</span>
</header>

<div class="controls">
  <span class="ctrl-label">Direction</span>
  <div class="ctrl-group" id="dir-group">
    <button class="ctrl-btn active" onclick="setDir('import')">↓ Import</button>
    <button class="ctrl-btn" onclick="setDir('export')">↑ Export power</button>
  </div>
  <div class="ctrl-sep"></div>
  <span class="ctrl-label">Liste</span>
  <div class="ctrl-group" id="list-group">
    <button class="ctrl-btn active" onclick="setList('ec')">EC</button>
    <button class="ctrl-btn" onclick="setList('abs')">+ Absorption</button>
    <button class="ctrl-btn" onclick="setList('stick')">+ Stickiness</button>
  </div>
</div>

<div class="kpi-bar" id="kpi-bar"></div>

<div class="main">
  <div id="map-wrap">
    <div id="tooltip"><div class="tt-name" id="tt-name"></div><div id="tt-body"></div></div>
  </div>
  <div class="side" id="side"></div>
</div>

<div class="products-section" id="prod-section"></div>

<footer>
  <span>© Pierre Rousseaux — <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></span>
  <span>BACI CEPII HS17 V202601 · Pool 2015–2019 · EUR constants 2019</span>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const iso2num={"AF":"4","AL":"8","DZ":"12","AD":"20","AO":"24","AR":"32","AM":"51","AU":"36","AT":"40","AZ":"31","BE":"56","BJ":"204","BO":"68","BA":"70","BR":"76","BG":"100","BF":"854","BI":"108","KH":"116","CM":"120","CA":"124","CF":"140","TD":"148","CL":"152","CN":"156","CO":"170","CD":"180","CG":"178","HR":"191","CU":"192","CY":"196","CZ":"203","DK":"208","EG":"818","EE":"233","ET":"231","FI":"246","FR":"250","GA":"266","GM":"270","GE":"268","DE":"276","GH":"288","GR":"300","GT":"320","GN":"324","HU":"348","IN":"356","ID":"360","IR":"364","IQ":"368","IE":"372","IL":"376","IT":"380","JP":"392","JO":"400","KZ":"398","KE":"404","KW":"414","LV":"428","LB":"422","LY":"434","LT":"440","LU":"442","MG":"450","MW":"454","MY":"458","ML":"466","MT":"470","MR":"478","MX":"484","MD":"498","MN":"496","ME":"499","MA":"504","MZ":"508","NA":"516","NL":"528","NZ":"554","NE":"562","NG":"566","NO":"578","OM":"512","PK":"586","PL":"616","PT":"620","QA":"634","RO":"642","RU":"643","SA":"682","SN":"686","RS":"688","SG":"702","SK":"703","SI":"705","ZA":"710","ES":"724","LK":"144","SE":"752","CH":"756","TJ":"762","TZ":"834","TH":"764","TN":"788","TR":"792","UA":"804","AE":"784","GB":"826","US":"840","UY":"858","VN":"704","ZM":"894","ZW":"716","MK":"807","KR":"410","CI":"384","PS":"275","NE":"562"};
const num2iso=Object.fromEntries(Object.entries(iso2num).map(([a,b])=>[b,a]));

const params = new URLSearchParams(window.location.search);
const ISO   = params.get('iso') || 'FR';
const PERIOD = 'pre';
let dir   = params.get('dir')  || 'import';
let list  = params.get('list') || 'ec';

let impData=null, expData=null, impProds=[], expProds=[];
let summary={}, feats=null, svgEl=null;

// Sync buttons
document.querySelectorAll('#dir-group .ctrl-btn').forEach((b,i)=>b.classList.toggle('active',i===(dir==='import'?0:1)));
document.querySelectorAll('#list-group .ctrl-btn').forEach((b,i)=>b.classList.toggle('active',['ec','abs','stick'][i]===list));

Promise.all([
  fetch(`data/import/${ISO}_${PERIOD}.json`).then(r=>r.json()).catch(()=>null),
  fetch(`data/export/${ISO}_${PERIOD}.json`).then(r=>r.json()).catch(()=>null),
  fetch(`data/import/${ISO}_${PERIOD}_products.json`).then(r=>r.json()).catch(()=>[]),
  fetch(`data/export/${ISO}_${PERIOD}_products.json`).then(r=>r.json()).catch(()=>[]),
  fetch('data/indicators/summary.json').then(r=>r.json()).catch(()=>[]),
  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
]).then(([imp,exp,ip,ep,sum,topo])=>{
  impData=imp; expData=exp; impProds=ip||[]; expProds=ep||[];
  sum.forEach(d=>{ summary[d.country]=d; });
  const info = summary[ISO]||{};
  document.getElementById('h-name').textContent = info.name||ISO;
  document.getElementById('h-iso').textContent  = ISO;
  document.getElementById('h-gdp').textContent  = info.gdp_eur_bn!=null?Math.round(info.gdp_eur_bn).toLocaleString('fr'):'—';
  feats = topojson.feature(topo, topo.objects.countries).features;
  render();
});

function setDir(d){
  dir=d;
  document.querySelectorAll('#dir-group .ctrl-btn').forEach((b,i)=>b.classList.toggle('active',i===(d==='import'?0:1)));
  render();
}
function setList(l){
  list=l;
  document.querySelectorAll('#list-group .ctrl-btn').forEach((b,i)=>b.classList.toggle('active',['ec','abs','stick'][i]===l));
  render();
}

function render(){
  renderKPIs();
  renderMap();
  renderSide();
  renderProducts();
}

/* ── KPIs ── */
function renderKPIs(){
  const el=document.getElementById('kpi-bar');
  const info=summary[ISO]||{};
  if(dir==='import'){
    const n = list==='ec'?info.n_ec:list==='abs'?info.n_abs:info.n_stick;
    const vi = info.vi_index;
    el.innerHTML=`
      <div class="kpi"><div class="kpi-l">Produits ${list==='ec'?'EC':list==='abs'?'EC+Abs':'EC+Abs+Stick'}</div><div class="kpi-v blue">${n??'—'}</div></div>
      <div class="kpi"><div class="kpi-l">VI / PIB</div><div class="kpi-v red">${vi!=null?(vi*100).toFixed(1)+'%':'—'}</div></div>
      <div class="kpi"><div class="kpi-l">Imports critiques (M€)</div><div class="kpi-v">${info.vi_raw!=null?Math.round(info.vi_raw/1000).toLocaleString('fr'):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">PIB moy. (Md€)</div><div class="kpi-v">${info.gdp_eur_bn!=null?Math.round(info.gdp_eur_bn).toLocaleString('fr'):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">DBS</div><div class="kpi-v" style="color:${info.dbs==null?'inherit':info.dbs<.85?'var(--blue)':info.dbs>1.15?'var(--red)':'inherit'}">${info.dbs!=null?info.dbs.toFixed(2):'—'}</div></div>`;
  } else {
    const n = info.n_prod_exp;
    el.innerHTML=`
      <div class="kpi"><div class="kpi-l">Produits reverse dep.</div><div class="kpi-v green">${n??'—'}</div></div>
      <div class="kpi"><div class="kpi-l">Pays exposés</div><div class="kpi-v blue">${info.n_cty_exp??'—'}</div></div>
      <div class="kpi"><div class="kpi-l">LI / PIB</div><div class="kpi-v green">${info.li_index!=null?(info.li_index*100).toFixed(1)+'%':'—'}</div></div>
      <div class="kpi"><div class="kpi-l">Exports critiques (M€)</div><div class="kpi-v">${info.li_raw!=null?Math.round(info.li_raw/1000).toLocaleString('fr'):'—'}</div></div>
      <div class="kpi"><div class="kpi-l">DBS</div><div class="kpi-v" style="color:${info.dbs==null?'inherit':info.dbs<.85?'var(--blue)':info.dbs>1.15?'var(--red)':'inherit'}">${info.dbs!=null?info.dbs.toFixed(2):'—'}</div></div>`;
  }
}

/* ── Map ── */
function renderMap(){
  const wrap=document.getElementById('map-wrap');
  wrap.querySelectorAll('svg').forEach(s=>s.remove());
  const W=wrap.clientWidth||600, H=Math.round(W*.52);
  wrap.style.height=H+'px';
  const proj=d3.geoNaturalEarth1().scale(W/6.3).translate([W/2,H/2]);
  const path=d3.geoPath(proj);
  svgEl=d3.select('#map-wrap').append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%').style('display','block');
  svgEl.append('rect').attr('width',W).attr('height',H).attr('fill','#f0f2f0');
  svgEl.append('path').datum(d3.geoGraticule()()).attr('d',path).attr('fill','none').attr('stroke','rgba(0,0,0,.04)').attr('stroke-width',.3);
  if(!feats) return;

  // Build lookup by partner
  let lookup={};
  if(dir==='import' && impData?.by_source){
    impData.by_source.forEach(d=>{lookup[d.top_exporter]=d;});
  } else if(dir==='export' && expData?.by_importer){
    expData.by_importer.forEach(d=>{lookup[d.importer]=d;});
  }

  const maxN=d3.max(Object.values(lookup),d=>d.n_products||0)||1;
  const colorScale = dir==='import'
    ? d3.scaleSequentialLog([1,maxN],d3.interpolateRgb('#f5ebe8','#d63b2f')).clamp(true)
    : d3.scaleSequentialLog([1,maxN],d3.interpolateRgb('#e8f5ef','#1a8a4a')).clamp(true);

  const tt=document.getElementById('tooltip');
  svgEl.selectAll('path.c').data(feats).join('path').attr('class','c')
    .attr('d',path)
    .attr('fill',d=>{
      const iso=num2iso[String(d.id)];
      if(iso===ISO) return '#eaf0fd';
      const dat=lookup[iso];
      return dat?colorScale(dat.n_products||1):'#e8e8e4';
    })
    .attr('stroke',d=>num2iso[String(d.id)]===ISO?'#1a56db':'rgba(255,255,255,.6)')
    .attr('stroke-width',d=>num2iso[String(d.id)]===ISO?.8:.3)
    .on('mousemove',function(event,d){
      const iso=num2iso[String(d.id)];
      const dat=lookup[iso]; if(!dat){tt.style.display='none';return;}
      const rect=wrap.getBoundingClientRect();
      let x=event.clientX-rect.left+12,y=event.clientY-rect.top+12;
      if(x+230>W) x-=242; if(y+130>H) y-=140;
      document.getElementById('tt-name').textContent=iso;
      document.getElementById('tt-body').innerHTML=dir==='import'?`
        <div class="tt-row"><span>Produits critiques</span><span class="tt-v">${dat.n_products}</span></div>
        <div class="tt-row"><span>Imports (k€)</span><span class="tt-v">${Math.round((dat.import_value||0)/1000).toLocaleString('fr')}</span></div>
        <div class="tt-row"><span>HHI moy.</span><span class="tt-v">${(dat.avg_hhi||0).toFixed(3)}</span></div>`:`
        <div class="tt-row"><span>Produits exposés</span><span class="tt-v">${dat.n_products}</span></div>
        <div class="tt-row"><span>Exports (k€)</span><span class="tt-v">${Math.round((dat.export_value||0)/1000).toLocaleString('fr')}</span></div>
        <div class="tt-row"><span>LI / PIB</span><span class="tt-v">${dat.li_index!=null?(dat.li_index*100).toFixed(1)+'%':'—'}</span></div>`;
      tt.style.display='block'; tt.style.left=x+'px'; tt.style.top=y+'px';
    })
    .on('mouseleave',()=>{tt.style.display='none';});
}

/* ── Side panel ── */
function renderSide(){
  const el=document.getElementById('side');
  el.innerHTML='';

  // Funnel (import only)
  if(dir==='import'){
    const info=summary[ISO]||{};
    const max=info.n_ec||1;
    const rows=[
      ['EC (3 critères)',info.n_ec||0,'funnel-ec',max],
      ['+ Absorption',info.n_abs||0,'funnel-abs',max],
      ['+ Stickiness q75',info.n_stick||0,'funnel-stick',max],
    ];
    const sec=document.createElement('div'); sec.className='side-section';
    sec.innerHTML=`<div class="side-title">Entonnoir listes</div>`+
      rows.map(([label,val,cls,m])=>`
        <div class="bar-row ${cls}">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${m>0?val/m*100:0}%"></div></div>
          <div class="bar-num">${val}</div>
        </div>`).join('');
    el.appendChild(sec);
  }

  // Sector
  const data=dir==='import'?impData:expData;
  const sectors=(data?.by_sector||[]).slice(0,10);
  const maxSec=Math.max(...sectors.map(s=>dir==='import'?s.n_ec:s.n_pairs),1);
  if(sectors.length){
    const sec=document.createElement('div'); sec.className='side-section';
    sec.innerHTML=`<div class="side-title">Répartition sectorielle</div>`+
      sectors.map(s=>{
        const n=dir==='import'?s.n_ec:s.n_pairs;
        return `<div class="bar-row">
          <div class="bar-label" title="${s.sector_label}">${s.sector_label||s.hs2}</div>
          <div class="bar-track"><div class="bar-fill sector-fill" style="width:${n/maxSec*100}%"></div></div>
          <div class="bar-num">${n}</div>
        </div>`;
      }).join('');
    el.appendChild(sec);
  }

  // Top partners
  if(dir==='import' && impData?.by_source){
    const top=(impData.by_source||[]).slice(0,8);
    const maxP=Math.max(...top.map(d=>d.n_products),1);
    const sec=document.createElement('div'); sec.className='side-section';
    sec.innerHTML=`<div class="side-title">Top fournisseurs critiques</div>`+
      top.map(d=>`<div class="bar-row partner-import">
        <div class="bar-label">${d.top_exporter}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.n_products/maxP*100}%"></div></div>
        <div class="bar-num">${d.n_products}</div>
      </div>`).join('');
    el.appendChild(sec);
  } else if(dir==='export' && expData?.by_importer){
    const top=(expData.by_importer||[]).slice(0,8);
    const maxP=Math.max(...top.map(d=>d.n_products),1);
    const sec=document.createElement('div'); sec.className='side-section';
    sec.innerHTML=`<div class="side-title">Top pays exposés</div>`+
      top.map(d=>`<div class="bar-row partner-export">
        <div class="bar-label">${d.importer_name||d.importer}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.n_products/maxP*100}%"></div></div>
        <div class="bar-num">${d.n_products}</div>
      </div>`).join('');
    el.appendChild(sec);
  }

  // Upstreamness
  if(dir==='import' && impData?.upstreamness_dist){
    const ud=impData.upstreamness_dist;
    const sec=document.createElement('div'); sec.className='side-section';
    sec.innerHTML=`<div class="side-title">Upstreamness</div>
      ${[['Moyenne',ud.up_mean],['Médiane',ud.up_median],['Q25',ud.up_q25],['Q75',ud.up_q75],['Max',ud.up_max]].map(([l,v])=>`
      <div class="bar-row" style="margin-bottom:4px">
        <div class="bar-label">${l}</div>
        <div class="bar-num" style="font-family:var(--mono);font-size:.72rem;color:var(--text)">${v}</div>
      </div>`).join('')}
      <div style="font-size:.65rem;color:var(--text3);margin-top:.5rem">1 = bien final · ≫1 = input amont (Antràs et al.)</div>`;
    el.appendChild(sec);
  }
}

/* ── Products table ── */
function renderProducts(){
  const el=document.getElementById('prod-section');
  let prods=dir==='import'?impProds:expProds;

  // Filtrer selon liste (import seulement)
  if(dir==='import'){
    if(list==='abs')   prods=prods.filter(p=>p.absorption===1);
    if(list==='stick') prods=prods.filter(p=>p.mr===1);
  }
  if(!prods.length){el.innerHTML='';return;}

  const top=prods.slice(0,60);
  el.innerHTML=`
    <div class="prod-header">
      <span class="prod-title">${dir==='import'?'Produits dépendants à l\'import':'Produits reverse dependencies'}</span>
      <span class="prod-count">${prods.length} produits · affichage 60</span>
    </div>
    <table>
      <thead><tr>
        <th>Code HS6</th><th>Description</th>
        ${dir==='import'?`<th>Fournisseur</th><th>HHI</th><th>Part extra</th><th>Abs</th><th>Sticky</th><th>Upstream.</th>`
        :`<th>Nb pays</th><th>Exports (k€)</th><th>HHI moy.</th><th>Upstream.</th>`}
      </tr></thead>
      <tbody id="prod-body"></tbody>
    </table>`;
  const tb=el.querySelector('#prod-body');
  top.forEach(p=>{
    if(dir==='import'){
      tb.innerHTML+=`<tr>
        <td>${p.code||''}</td><td class="desc" title="${p.description||''}">${p.description||''}</td>
        <td>${p.top_exporter||'—'}</td>
        <td class="num">${p.hhi!=null?p.hhi.toFixed(3):'—'}</td>
        <td class="num">${p.share_imports_extra!=null?(p.share_imports_extra*100).toFixed(0)+'%':'—'}</td>
        <td><span class="dot${p.absorption?` on`:''}"></span></td>
        <td><span class="dot${p.mr?` on`:''}"></span></td>
        <td class="num">${p.upstreamness!=null?p.upstreamness.toFixed(2):'—'}</td>
      </tr>`;
    } else {
      tb.innerHTML+=`<tr>
        <td>${p.code||''}</td><td class="desc" title="${p.description||''}">${p.description||''}</td>
        <td class="num">${p.n_importers||0}</td>
        <td class="num">${p.total_exports!=null?Math.round(p.total_exports/1000).toLocaleString('fr'):'—'}</td>
        <td class="num">${p.avg_hhi!=null?p.avg_hhi.toFixed(3):'—'}</td>
        <td class="num">${p.upstreamness!=null?p.upstreamness.toFixed(2):'—'}</td>
      </tr>`;
    }
  });
}
</script>
</body>
</html>
